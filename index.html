<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>屁屁體操 兒童版 — 動作分解與音樂合練互動簡報</title>
<style>
  :root {
    --cream: #FFFDF7;
    --navy: #0F172A;
    --slate: #1E293B;
    --text: #111827;
    --muted: #475569;
    --border: #CBD5E1;
    --gold: #FACC15;
    --gold-soft: #FEF3C7;
    --core-main: #B45309; --core-accent: #D97706; --core-soft: #FEF3C7;
    --v1-main: #1D4ED8;   --v1-accent: #2563EB;   --v1-soft: #DBEAFE;
    --v2-main: #15803D;   --v2-accent: #16A34A;   --v2-soft: #DCFCE7;
    --v3-main: #7E22CE;   --v3-accent: #9333EA;   --v3-soft: #F3E8FF;
    --prac_slow-main: #0369A1; --prac_slow-accent: #0284C7; --prac_slow-soft: #E0F2FE;
    --prac_full-main: #B91C1C; --prac_full-accent: #DC2626; --prac_full-soft: #FEE2E2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    font-family: "Microsoft JhengHei", "GenSekiGothic2TW", "Noto Sans TC", sans-serif;
    background: #0B1220;
    color: var(--text);
    user-select: none;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; width: 100vw;
  }
  .stage-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 14px 6px;
  }
  .slide {
    width: 100%; height: 100%;
    max-width: 1440px; max-height: 820px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    display: flex; flex-direction: column;
    background: var(--cream);
    position: relative;
  }
  .slide.dark { background: var(--navy); color: #fff; }

  /* Header Bar */
  .hdr {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 24px;
    background: var(--theme-main);
    color: #fff; flex-shrink: 0;
  }
  .hdr-pill {
    background: #fff; color: var(--theme-main);
    font-weight: 800; font-size: 20px;
    padding: 6px 20px; border-radius: 999px;
    white-space: nowrap;
  }
  .hdr-title {
    font-size: 32px; font-weight: 900; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-prog {
    font-size: 20px; font-weight: 800; color: var(--gold-soft);
    white-space: nowrap;
  }

  /* Cover & Finale */
  .hero-layout {
    flex: 1; display: grid; grid-template-columns: 1.05fr 0.95fr;
    gap: 28px; padding: 36px 44px; align-items: center;
    border-top: 10px solid var(--gold);
  }
  .hero-badge {
    display: inline-block; background: var(--gold); color: var(--navy);
    font-weight: 900; font-size: 20px; padding: 8px 22px; border-radius: 12px;
    margin-bottom: 18px;
  }
  .hero-h1 { font-size: 54px; font-weight: 900; line-height: 1.15; margin-bottom: 12px; }
  .hero-sub { font-size: 26px; font-weight: 700; color: var(--gold-soft); margin-bottom: 24px; }
  .hero-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--slate); border: 2.5px solid var(--gold);
    border-radius: 14px; padding: 14px 18px; margin-bottom: 14px;
    cursor: pointer; transition: transform .15s, background .15s;
  }
  .hero-card:hover { transform: translateY(-2px); background: #26354d; }
  .hero-card.blue { border-color: #38BDF8; }
  .hero-num {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 900; color: var(--navy); background: var(--gold);
  }
  .hero-card.blue .hero-num { background: #38BDF8; }
  .hero-card h3 { font-size: 22px; margin-bottom: 4px; color: #fff; }
  .hero-card p { font-size: 16px; color: #CBD5E1; }
  .hero-img-box {
    background: #fff; border: 5px solid var(--gold); border-radius: 18px;
    overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }
  .hero-img-box img { width: 100%; display: block; }
  .hero-img-cap {
    background: var(--slate); color: var(--gold-soft);
    text-align: center; font-size: 24px; font-weight: 800; padding: 12px;
  }
  .hero-actions { display: flex; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .big-cta {
    border: none; border-radius: 12px; padding: 14px 26px;
    font-size: 21px; font-weight: 900; cursor: pointer;
    font-family: inherit; transition: transform .12s, filter .12s;
  }
  .big-cta:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .big-cta.primary { background: var(--gold); color: var(--navy); }
  .big-cta.secondary { background: #38BDF8; color: var(--navy); }

  /* Roadmap */
  .roadmap-body { flex: 1; padding: 18px 28px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .tip-banner {
    background: var(--gold-soft); border: 2.5px solid var(--core-accent);
    color: #78350F; font-size: 23px; font-weight: 900;
    text-align: center; padding: 12px 18px; border-radius: 14px;
  }
  .rm-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; min-height: 0; }
  .rm-col {
    background: #fff; border: 3px solid var(--c-main);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .rm-col-hdr {
    background: var(--c-main); color: #fff; text-align: center; padding: 14px 10px;
  }
  .rm-col-hdr h3 { font-size: 23px; font-weight: 900; margin-bottom: 4px; }
  .rm-col-hdr p { font-size: 16px; color: var(--gold-soft); font-weight: 700; }
  .rm-col-list {
    flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; justify-content: space-around;
  }
  .rm-item {
    background: var(--c-soft); border: 2px solid transparent; border-radius: 12px;
    padding: 14px 10px; text-align: center; font-size: 19px; font-weight: 800;
    color: var(--text); cursor: pointer; transition: transform .12s, border-color .12s;
  }
  .rm-item:hover { transform: scale(1.02); border-color: var(--c-main); }

  /* Divider */
  .div-body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 36px 60px; gap: 18px;
    border-top: 12px solid var(--theme-accent);
    border-bottom: 12px solid var(--theme-accent);
  }
  .div-badge {
    align-self: flex-start; background: var(--theme-accent); color: #fff;
    font-size: 24px; font-weight: 900; padding: 8px 26px; border-radius: 12px;
  }
  .div-title { font-size: 50px; font-weight: 900; color: #fff; }
  .div-sub { font-size: 26px; font-weight: 700; color: var(--gold-soft); margin-bottom: 12px; }
  .div-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .div-card {
    background: var(--slate); border: 3px solid var(--theme-accent);
    border-radius: 18px; padding: 26px 18px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .div-num {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--theme-accent); color: #fff;
    font-size: 26px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .div-card-txt { font-size: 25px; font-weight: 800; line-height: 1.4; white-space: pre-line; }

  /* Move & Practice Main Two-Column Grid */
  .move-body {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 0.96fr 1.04fr;
    gap: 20px; padding: 16px 24px 12px;
  }
  .prac-body {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 0.62fr 1.38fr;
    gap: 20px; padding: 16px 24px 12px;
  }
  .left-col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .steps-card {
    background: #fff; border: 2px solid var(--border);
    border-left: 12px solid var(--theme-main);
    border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .step-row {
    display: flex; align-items: center; gap: 14px;
    padding: 6px 10px; border-radius: 10px; cursor: pointer;
    transition: background .12s;
  }
  .step-row:hover { background: #F1F5F9; }
  .step-row.done { background: #ECFDF5; }
  .step-row.done .step-txt { color: #065F46; }
  .step-num {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: var(--theme-main); color: #fff;
    font-size: 21px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .step-row.done .step-num { background: #16A34A; }
  .step-txt { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.25; }
  .lyric-bar {
    background: var(--theme-soft); color: var(--theme-main);
    border-radius: 10px; padding: 8px 14px;
    font-size: 17px; font-weight: 800; margin-top: 2px;
  }
  .stills-label { font-size: 17px; font-weight: 800; color: var(--muted); }
  .stills-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    flex: 1; min-height: 0; align-items: start;
  }
  .still-btn {
    border: none; background: transparent; padding: 0; cursor: zoom-in;
    border-radius: 8px; overflow: hidden; transition: transform .12s;
  }
  .still-btn:hover { transform: scale(1.03); }
  .still-btn img { width: 100%; display: block; border-radius: 6px; }

  /* Practice checklist */
  .prac-card {
    background: #fff; border: 2.5px solid var(--theme-main);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .prac-card-hdr {
    background: var(--theme-soft); color: var(--theme-main);
    text-align: center; font-size: 21px; font-weight: 900; padding: 12px 10px;
    border-bottom: 2px solid var(--theme-main);
  }
  .prac-list {
    flex: 1; padding: 10px 12px; display: flex; flex-direction: column;
    gap: 8px; justify-content: space-around; overflow-y: auto;
  }
  .prac-item {
    background: #F8FAFC; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
    font-size: 18px; font-weight: 800; color: var(--text);
  }
  .prac-item.core { background: var(--gold-soft); color: #92400E; border-color: #F59E0B; }

  /* Right Video Panel & Classroom Controls */
  .right-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; justify-content: center; }
  .vid-shell {
    background: var(--navy); border: 4px solid var(--theme-main);
    border-radius: 12px; overflow: hidden; position: relative;
    width: 100%; aspect-ratio: 720 / 452; max-height: 520px;
    margin: 0 auto; display: flex; flex-direction: column;
  }
  /* Live un-flipped cue banner shown ONLY in mirror mode */
  .mirror-banner {
    display: none; height: 13.27%; flex-shrink: 0;
    background: var(--navy); border-bottom: 3px solid var(--theme-accent);
    align-items: center; gap: 12px; padding: 0 14px; color: #FFFBEB;
  }
  .mirror-badge {
    background: #FACC15; color: var(--navy); font-weight: 900; font-size: 17px;
    padding: 3px 12px; border-radius: 8px; white-space: nowrap;
  }
  .mirror-cue {
    font-size: 22px; font-weight: 900; flex: 1; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vid-viewport { flex: 1; position: relative; overflow: hidden; background: #000; }
  .vid-viewport video {
    width: 100%; height: 100%; display: block; object-fit: contain;
    cursor: pointer;
  }
  /* Mirror mode: show un-flipped HTML cue bar, crop top 13.27% of flipped video! */
  .vid-shell.mirrored .mirror-banner { display: flex; }
  .vid-shell.mirrored .vid-viewport video {
    height: 115.30%; /* 452 / 392 = 115.306% */
    margin-top: -15.30%; /* hide burned-in top 60px banner */
    transform: scaleX(-1);
    object-fit: cover;
  }

  /* Big tactile teacher controls */
  .ctrl-bar {
    background: var(--navy); border-radius: 12px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  }
  .cbtn {
    border: 2px solid #334155; background: #1E293B; color: #fff;
    font-family: inherit; font-size: 17px; font-weight: 800;
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
    transition: transform .1s, background .12s, border-color .12s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cbtn:hover { background: #334155; transform: translateY(-1px); }
  .cbtn.play-main { background: var(--gold); color: var(--navy); border-color: var(--gold); font-size: 18px; padding: 9px 18px; }
  .cbtn.play-main:hover { filter: brightness(1.06); }
  .cbtn.active { background: #0284C7; border-color: #38BDF8; color: #fff; }
  .cbtn.active-green { background: #15803D; border-color: #4ADE80; color: #fff; }
  .cbtn.active-purple { background: #7E22CE; border-color: #D8B4FE; color: #fff; }
  .spd-group { display: inline-flex; gap: 4px; background: #0B1220; padding: 4px; border-radius: 10px; }
  .spd-btn {
    border: none; background: transparent; color: #CBD5E1;
    font-family: inherit; font-size: 15px; font-weight: 800;
    padding: 6px 10px; border-radius: 7px; cursor: pointer;
  }
  .spd-btn.active { background: #38BDF8; color: var(--navy); }
  .ctrl-note {
    text-align: center; font-size: 14px; font-weight: 700; color: var(--muted);
  }

  /* Bottom Slide Progress Strip inside slide */
  .prog-track { height: 8px; background: #E2E8F0; flex-shrink: 0; }
  .prog-fill { height: 100%; background: var(--theme-accent); transition: width .25s; }

  /* Global Footer Nav Bar */
  .nav-bar {
    height: 62px; flex-shrink: 0;
    background: #0F172A; border-top: 2px solid #1E293B;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; gap: 14px; color: #fff;
  }
  .nav-btn {
    border: 2px solid #475569; background: #1E293B; color: #fff;
    font-family: inherit; font-size: 19px; font-weight: 800;
    padding: 9px 22px; border-radius: 12px; cursor: pointer;
    transition: background .12s;
  }
  .nav-btn:hover:not(:disabled) { background: #334155; border-color: var(--gold); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn.primary { background: var(--gold); color: var(--navy); border-color: var(--gold); }
  .nav-mid { display: flex; align-items: center; gap: 14px; }
  .page-ind { font-size: 19px; font-weight: 800; color: var(--gold-soft); min-width: 110px; text-align: center; }

  /* Drawer Menu Modal & Lightbox */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center; z-index: 99;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .menu-panel {
    background: #0F172A; border: 3px solid var(--gold); border-radius: 18px;
    width: 100%; max-width: 920px; max-height: 84vh;
    display: flex; flex-direction: column; overflow: hidden; color: #fff;
  }
  .menu-hdr {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; background: #1E293B; border-bottom: 2px solid #334155;
  }
  .menu-hdr h2 { font-size: 24px; color: var(--gold); }
  .menu-grid {
    padding: 18px; display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; overflow-y: auto;
  }
  .menu-item {
    text-align: left; border: 2px solid #334155; background: #1E293B; color: #fff;
    padding: 11px 14px; border-radius: 10px; font-family: inherit;
    font-size: 16px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
  }
  .menu-item:hover { border-color: var(--gold); background: #26354d; }
  .menu-item.curr { border-color: var(--gold); background: #B45309; }
  .menu-pg {
    background: rgba(255,255,255,0.16); padding: 2px 8px; border-radius: 6px;
    font-size: 14px; min-width: 40px; text-align: center;
  }

  .lightbox-img {
    max-width: 88vw; max-height: 84vh; border: 5px solid var(--gold);
    border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }

  @media (max-width: 1080px) {
    .hdr-title { font-size: 24px; }
    .step-txt { font-size: 19px; }
    .prac-item { font-size: 15px; padding: 7px 10px; }
    .hero-h1 { font-size: 38px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap">
    <div id="slideRoot" class="slide"></div>
  </div>
  <div class="nav-bar">
    <button id="btnPrev" class="nav-btn">⬅ 上一頁</button>
    <div class="nav-mid">
      <button id="btnMenu" class="nav-btn">📋 快速選頁</button>
      <div id="pageInd" class="page-ind">1 / 28</div>
      <button id="btnFull" class="nav-btn">⛶ 全螢幕</button>
    </div>
    <button id="btnNext" class="nav-btn primary">下一頁 ➡</button>
  </div>
</div>

<!-- Quick Jump Menu -->
<div id="menuModal" class="modal-bg">
  <div class="menu-panel">
    <div class="menu-hdr">
      <h2>📋 快速跳轉目錄（共 28 頁）</h2>
      <button id="btnCloseMenu" class="nav-btn">✕ 關閉</button>
    </div>
    <div id="menuGrid" class="menu-grid"></div>
  </div>
</div>

<!-- Still Photo Lightbox -->
<div id="lightboxModal" class="modal-bg">
  <img id="lightboxImg" class="lightbox-img" alt="分解動作放大圖">
</div>

let currentIndex = 0;
let mirrorEnabled = false;
let currentVideoEl = null;

function setThemeVars(group) {
  const r = document.getElementById("slideRoot");
  r.style.setProperty("--theme-main", `var(--${group}-main)`);
  r.style.setProperty("--theme-accent", `var(--${group}-accent)`);
  r.style.setProperty("--theme-soft", `var(--${group}-soft)`);
}

function goTo(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  if (currentVideoEl) {
    try { currentVideoEl.pause(); } catch(e) {}
    currentVideoEl = null;
  }
  currentIndex = idx;
  render();
}

function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightboxModal").classList.add("open");
}

function renderVideoBlock(s) {
  const defaultLoop = Boolean(s.defaultLoop);
  const noteText = s.type === "move"
    ? `預設影片為「${s.baseSpeedLabel}」・點影片畫面即可播放／暫停，不會誤換頁`
    : `影片上方已內建即時大字中文口訣（${s.durationLabel}）・可隨時重播或開啟循環練習`;

  return `
    <div class="right-col">
      <div class="vid-shell ${mirrorEnabled ? "mirrored" : ""}" id="vidShell">
        <div class="mirror-banner" id="mirrorBanner">
          <span class="mirror-badge" id="mirrorBadge">🪞 鏡像模式</span>
          <span class="mirror-cue" id="mirrorCue">${s.cues && s.cues.length ? s.cues[0].text : s.title}</span>
        </div>
        <div class="vid-viewport">
          <video id="mainVideo" src="${s.video}" poster="${s.poster}" playsinline preload="metadata" ${defaultLoop ? "loop" : ""}></video>
        </div>
      </div>

      <div class="ctrl-bar">
        <button class="cbtn play-main" id="btnPlayPause">▶ 播放示範</button>
        <button class="cbtn" id="btnReplay">↺ 重播這一段</button>
        <button class="cbtn ${defaultLoop ? "active-green" : ""}" id="btnLoop">🔁 循環：${defaultLoop ? "開" : "關"}</button>
        <div class="spd-group" title="調整播放速度">
          <button class="spd-btn" data-rate="0.8">🐢 再慢一點</button>
          <button class="spd-btn active" data-rate="1.0">標準</button>
          <button class="spd-btn" data-rate="1.2">稍快</button>
        </div>
        <button class="cbtn ${mirrorEnabled ? "active-purple" : ""}" id="btnMirror">🪞 鏡像：${mirrorEnabled ? "開" : "關"}</button>
      </div>
      <div class="ctrl-note">${noteText}</div>
    </div>
  `;
}

function bindVideoControls(s) {
  const vid = document.getElementById("mainVideo");
  if (!vid) return;
  currentVideoEl = vid;
  const btnPlay = document.getElementById("btnPlayPause");
  const btnReplay = document.getElementById("btnReplay");
  const btnLoop = document.getElementById("btnLoop");
  const btnMirror = document.getElementById("btnMirror");
  const vidShell = document.getElementById("vidShell");
  const mirrorBadge = document.getElementById("mirrorBadge");
  const mirrorCue = document.getElementById("mirrorCue");

  function syncPlayBtn() {
    btnPlay.textContent = vid.paused ? "▶ 播放示範" : "⏸ 暫停";
  }

  function togglePlay() {
    if (vid.paused) {
      vid.play().catch(() => {});
    } else {
      vid.pause();
    }
  }

  vid.addEventListener("click", togglePlay);
  vid.addEventListener("play", syncPlayBtn);
  vid.addEventListener("pause", syncPlayBtn);
  vid.addEventListener("ended", syncPlayBtn);
  btnPlay.addEventListener("click", togglePlay);

  btnReplay.addEventListener("click", () => {
    vid.currentTime = 0;
    vid.play().catch(() => {});
  });

  btnLoop.addEventListener("click", () => {
    vid.loop = !vid.loop;
    btnLoop.classList.toggle("active-green", vid.loop);
    btnLoop.textContent = `🔁 循環：${vid.loop ? "開" : "關"}`;
  });

  btnMirror.addEventListener("click", () => {
    mirrorEnabled = !mirrorEnabled;
    vidShell.classList.toggle("mirrored", mirrorEnabled);
    btnMirror.classList.toggle("active-purple", mirrorEnabled);
    btnMirror.textContent = `🪞 鏡像：${mirrorEnabled ? "開" : "關"}`;
  });

  document.querySelectorAll(".spd-btn").forEach((b) => {
    b.addEventListener("click", () => {
      const rate = parseFloat(b.dataset.rate);
      vid.playbackRate = rate;
      document.querySelectorAll(".spd-btn").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
    });
  });

  // Live cue sync for mirror mode
  if (s.cues && s.cues.length) {
    vid.addEventListener("timeupdate", () => {
      const t = vid.currentTime;
      let hit = s.cues[0];
      for (const c of s.cues) {
        if (t >= c.s && t <= c.e + 0.15) { hit = c; break; }
      }
      if (mirrorBadge) mirrorBadge.textContent = `🪞 ${hit.badge}`;
      if (mirrorCue) mirrorCue.textContent = hit.text;
    });
  }
}

function render() {
  const s = SLIDES[currentIndex];
  const root = document.getElementById("slideRoot");
  setThemeVars(s.group || "core");
  root.className = "slide" + ((s.type === "cover" || s.type === "divider" || s.type === "finale") ? " dark" : "");

  if (s.type === "cover") {
    root.innerHTML = `
      <div class="hero-layout">
        <div>
          <div class="hero-badge">慢步調動作分解・互動點播練習版</div>
          <h1 class="hero-h1">屁屁體操 兒童版</h1>
          <div class="hero-sub">跳舞動作教學簡報（おなら体操）</div>

          <div class="hero-card" onclick="goTo(2)">
            <div class="hero-num">1</div>
            <div>
              <h3>前半段：12 個動作逐一慢速分解</h3>
              <p>3 連拍圖片 ＋ 0.75 倍慢速影片，可無限循環反覆練</p>
            </div>
          </div>
          <div class="hero-card blue" onclick="goTo(18)">
            <div class="hero-num">2</div>
            <div>
              <h3>後半段：搭配音樂分段合練到全曲</h3>
              <p>先 0.8 倍暖身，再 1.0 倍原速跳到底（附即時中文口訣）</p>
            </div>
          </div>

          <div class="hero-actions">
            <button class="big-cta primary" onclick="goTo(1)">▶ 開始上課（看全曲地圖）</button>
            <button class="big-cta secondary" onclick="goTo(19)">🎵 直接進音樂合練</button>
          </div>
        </div>
        <div class="hero-img-box">
          <img src="media/stills/hero_cover.jpg" alt="屁屁體操全體歡呼">
          <div class="hero-img-cap">大家一起開心動一動！</div>
        </div>
      </div>
    `;
  } else if (s.type === "roadmap") {
    const cols = [
      { g: "core", t: "3 個招牌招式", sub: "三段都會出現！", items: [
        { txt: "① 舉高雙手・左右搖", idx: 3 },
        { txt: "② 頂 3 下・舉手轉圈", idx: 4 },
        { txt: "③ 右手・左手・側定格", idx: 5 },
      ]},
      { g: "v1", t: "第 1 段變化", sub: "記住：雙手插腰", items: [
        { txt: "③ 大大張開 → 小小縮", idx: 7 },
        { txt: "④ 單手舉高 → 彈跳搖", idx: 8 },
        { txt: "⑤ 雙手插腰 → 側面走", idx: 9 },
      ]},
      { g: "v2", t: "第 2 段變化", sub: "記住：雙手舉高高", items: [
        { txt: "③ 左踢踢・右踢踢", idx: 11 },
        { txt: "④ 雙手打開・搖擺轉", idx: 12 },
        { txt: "⑤ 雙手舉高 → 展翅走", idx: 13 },
      ]},
      { g: "v3", t: "第 3 段變化", sub: "記住：歡呼說掰掰", items: [
        { txt: "③ 單手超人 → 裝可愛", idx: 15 },
        { txt: "④ 左看一看・右看一看", idx: 16 },
        { txt: "⑤ 大張開 → 歡呼掰掰", idx: 17 },
      ]},
    ];
    root.innerHTML = `
      <div class="hdr">
        <div class="hdr-pill">超好記祕訣</div>
        <div class="hdr-title">只要記 3 個招牌招式，就會跳一半！</div>
        <div class="hdr-prog">點任一招直接練習</div>
      </div>
      <div class="roadmap-body">
        <div class="tip-banner">全曲分成 3 大段，每段都從「招牌 1 → 招牌 2」開始，最後用「招牌 3」結尾！</div>
        <div class="rm-grid">
          ${cols.map(c => `
            <div class="rm-col" style="--c-main:var(--${c.g}-main);--c-soft:var(--${c.g}-soft);">
              <div class="rm-col-hdr"><h3>${c.t}</h3><p>${c.sub}</p></div>
              <div class="rm-col-list">
                ${c.items.map(it => `<div class="rm-item" onclick="goTo(${it.idx})">${it.txt}</div>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  } else if (s.type === "divider") {
    root.innerHTML = `
      <div class="div-body">
        <div class="div-badge">${s.badge}</div>
        <div class="div-title">${s.title}</div>
        <div class="div-sub">${s.subtitle}</div>
        <div class="div-cards">
          ${s.bullets.map((b, i) => `
            <div class="div-card">
              <div class="div-num">${i + 1}</div>
              <div class="div-card-txt">${b}</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  } else if (s.type === "move") {
    const pct = Math.round((s.moveNum / 12) * 100);
    root.innerHTML = `
      <div class="hdr">
        <div class="hdr-pill">${s.badge}</div>
        <div class="hdr-title">${s.title}</div>
        <div class="hdr-prog">${s.progress}</div>
      </div>
      <div class="move-body">
        <div class="left-col">
          <div class="steps-card">
            ${s.steps.map((st, i) => `
              <div class="step-row" onclick="this.classList.toggle('done')">
                <div class="step-num">${i + 1}</div>
                <div class="step-txt">${st}</div>
              </div>
            `).join("")}
            <div class="lyric-bar">🎵 歌詞提示：${s.lyric}</div>
          </div>
          <div class="stills-label">動作 1 → 2 → 3 分解照片（點照片可放大）</div>
          <div class="stills-row">
            ${s.stills.map(st => `
              <button class="still-btn" onclick="openLightbox('${st.img}')">
                <img src="${st.img}" alt="${st.label}">
              </button>
            `).join("")}
          </div>
        </div>
        ${renderVideoBlock(s)}
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    `;
    bindVideoControls(s);
  } else if (s.type === "practice") {
    const pct = Math.round((s.pracNum / 8) * 100);
    root.innerHTML = `
      <div class="hdr">
        <div class="hdr-pill">${s.badge}</div>
        <div class="hdr-title">${s.title}</div>
        <div class="hdr-prog">${s.progress}</div>
      </div>
      <div class="prac-body">
        <div class="prac-card">
          <div class="prac-card-hdr">${s.listTitle}</div>
          <div class="prac-list">
            ${s.items.map(it => `<div class="prac-item ${it.core ? "core" : ""}">${it.text}</div>`).join("")}
          </div>
        </div>
        ${renderVideoBlock(s)}
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    `;
    bindVideoControls(s);
  } else if (s.type === "finale") {
    root.innerHTML = `
      <div class="hero-layout">
        <div>
          <h1 class="hero-h1" style="color:var(--gold);">太棒了！大成功！</h1>
          <div class="hero-sub">你已經學會整首《屁屁體操》！</div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;">
            <div class="hero-num" style="background:#22C55E;color:#fff;">✔</div>
            <div><h3>記住了 3 個招牌固定招式</h3></div>
          </div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;">
            <div class="hero-num" style="background:#22C55E;color:#fff;">✔</div>
            <div><h3>學會了第 1、2、3 段專屬動作</h3></div>
          </div>
          <div class="hero-card" style="border-color:#22C55E;cursor:default;">
            <div class="hero-num" style="background:#22C55E;color:#fff;">✔</div>
            <div><h3>跟著音樂完成慢速與原速大挑戰</h3></div>
          </div>
          <div class="hero-actions">
            <button class="big-cta primary" onclick="goTo(26)">🔥 再跳一次原速全曲</button>
            <button class="big-cta secondary" onclick="goTo(0)">🏠 回到封面</button>
          </div>
        </div>
        <div class="hero-img-box">
          <img src="media/stills/hero_bye.jpg" alt="揮手說掰掰">
          <div class="hero-img-cap">揮揮手說掰掰，下次再一起跳！</div>
        </div>
      </div>
    `;
  }

  // Update nav bar
  document.getElementById("pageInd").textContent = `${currentIndex + 1} / ${SLIDES.length}`;
  document.getElementById("btnPrev").disabled = currentIndex === 0;
  document.getElementById("btnNext").disabled = currentIndex === SLIDES.length - 1;
}

// Build quick jump menu
function openMenu() {
  const grid = document.getElementById("menuGrid");
  grid.innerHTML = SLIDES.map((s, i) => `
    <button class="menu-item ${i === currentIndex ? "curr" : ""}" onclick="goTo(${i}); closeMenu();">
      <span class="menu-pg">P${String(i + 1).padStart(2, "0")}</span>
      <span>${s.navTitle}</span>
    </button>
  `).join("");
  document.getElementById("menuModal").classList.add("open");
}
function closeMenu() { document.getElementById("menuModal").classList.remove("open"); }

document.getElementById("btnPrev").addEventListener("click", () => goTo(currentIndex - 1));
document.getElementById("btnNext").addEventListener("click", () => goTo(currentIndex + 1));
document.getElementById("btnMenu").addEventListener("click", openMenu);
document.getElementById("btnCloseMenu").addEventListener("click", closeMenu);
document.getElementById("menuModal").addEventListener("click", (e) => { if (e.target.id === "menuModal") closeMenu(); });
document.getElementById("lightboxModal").addEventListener("click", () => document.getElementById("lightboxModal").classList.remove("open"));
document.getElementById("btnFull").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
});

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (document.getElementById("menuModal").classList.contains("open")) {
    if (e.key === "Escape") closeMenu();
    return;
  }
  if (document.getElementById("lightboxModal").classList.contains("open")) {
    if (e.key === "Escape") document.getElementById("lightboxModal").classList.remove("open");
    return;
  }
  if (e.key === "ArrowRight" || e.key === "PageDown") goTo(currentIndex + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(currentIndex - 1);
  else if (e.key === " " && currentVideoEl) { e.preventDefault(); document.getElementById("btnPlayPause").click(); }
  else if ((e.key === "r" || e.key === "R") && currentVideoEl) document.getElementById("btnReplay").click();
  else if ((e.key === "l" || e.key === "L") && currentVideoEl) document.getElementById("btnLoop").click();
  else if ((e.key === "m" || e.key === "M") && currentVideoEl) document.getElementById("btnMirror").click();
});

render();
</script>
</body>
</html>
